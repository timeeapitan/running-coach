<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>{% block title %}Running Coach{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>
<nav>
  <!-- Row 1: brand + user -->
  <div class="nav-top">
    <a href="/" class="nav-brand">Running Coach</a>
    <div class="nav-user">
      {% if user_avatar %}
      <img src="{{ user_avatar }}" alt="{{ user_name }}">
      {% endif %}
      <span class="nav-user-name">{{ user_name }}</span>
      <a href="/setup" class="nav-icon-btn" title="Settings">⚙</a>
      <a href="/logout" class="nav-signout">Sign out</a>
    </div>
  </div>
  <!-- Row 2: page links (scrollable, never overflows) -->
  <div class="nav-links">
    <a href="/"         class="{{ 'active' if request.path == '/' }}">Dashboard</a>
    <a href="/history"  class="{{ 'active' if request.path == '/history' }}">History</a>
    <a href="/insights" class="{{ 'active' if request.path == '/insights' }}">Insights</a>
    <a href="/log"      class="{{ 'active' if request.path == '/log' }}">Notes</a>
    <a href="/schedule" class="{{ 'active' if request.path == '/schedule' }}">Schedule</a>
    <a href="/race"     class="{{ 'active' if request.path == '/race' }}">Race</a>
  </div>
</nav>
<div class="page">
  {% block content %}{% endblock %}
</div>

<div id="syncOverlay" class="sync-overlay" aria-live="polite" aria-hidden="true">
  <div class="sync-loader-card">
    <div class="sync-spinner"></div>
    <div class="sync-loader-title">Syncing your watch data</div>
    <div class="sync-loader-text">Fetching your latest activities and recovery metrics. This can take a few seconds.</div>
  </div>
</div>
<script>
  // Hide overlay immediately on any page load/restore — including Safari bfcache restores.
  // pageshow fires on normal loads AND when Safari restores a page from back-forward cache.
  window.addEventListener("pageshow", function(e) {
    var overlay = document.getElementById("syncOverlay");
    if (overlay) {
      overlay.classList.remove("is-visible");
      overlay.setAttribute("aria-hidden", "true");
    }
  });

  document.addEventListener("DOMContentLoaded", function () {
    var overlay = document.getElementById("syncOverlay");
    if (!overlay) return;

    var title = overlay.querySelector(".sync-loader-title");
    var text = overlay.querySelector(".sync-loader-text");

    function showOverlay(customTitle, customText) {
      if (title && customTitle) title.textContent = customTitle;
      if (text && customText) text.textContent = customText;
      overlay.classList.add("is-visible");
      overlay.setAttribute("aria-hidden", "false");
    }

      // Sync buttons — check if sync is available before showing overlay or navigating
    var syncLinks = document.querySelectorAll('a[href="/refresh"], a[href^="/refresh?"]');
    syncLinks.forEach(function(link) {

      function handleSyncTap(e) {
        e.preventDefault();
        var href = link.getAttribute("href");

        // Quick check — is sync available or in cooldown?
        fetch("/api/sync-status")
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.can_sync) {
              // Sync is available — show overlay and navigate
              showOverlay("Syncing your watch data",
                "Fetching your latest activities from Garmin. This usually takes 5–15 seconds.");
              startProgressMessages();
              // Safety timeout
              setTimeout(function() {
                if (overlay && overlay.classList.contains("is-visible")) {
                  overlay.classList.remove("is-visible");
                  overlay.setAttribute("aria-hidden", "true");
                  showToast("Sync is taking longer than expected. Try again in a moment.");
                }
              }, 90000);
              window.location.href = href;
            } else {
              // In cooldown — show dismissible banner, do NOT navigate
              showSyncCooldownBanner(data.message);
            }
          })
          .catch(function() {
            // If check fails just navigate normally
            window.location.href = href;
          });
      }

      link.addEventListener("touchstart", handleSyncTap, { passive: false });
      link.addEventListener("click", handleSyncTap);
    });

    // Dismissible sync cooldown banner
    function showSyncCooldownBanner(msg) {
      // Remove any existing banner
      var existing = document.getElementById("syncCooldownBanner");
      if (existing) existing.remove();

      var banner = document.createElement("div");
      banner.id = "syncCooldownBanner";
      banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:10000;" +
        "background:#1a1a18;color:#fff;font-size:13px;padding:14px 48px 14px 16px;" +
        "text-align:center;line-height:1.4;box-shadow:0 2px 12px rgba(0,0,0,0.2);";
      banner.textContent = msg;

      // Dismiss button
      var close = document.createElement("button");
      close.textContent = "✕";
      close.style.cssText = "position:absolute;right:14px;top:50%;transform:translateY(-50%);" +
        "background:none;border:none;color:#fff;font-size:16px;cursor:pointer;padding:4px 8px;";
      close.onclick = function() { banner.remove(); };
      banner.appendChild(close);

      document.body.appendChild(banner);

      // Auto-dismiss after 6 seconds
      setTimeout(function() {
        if (document.getElementById("syncCooldownBanner")) {
          banner.style.transition = "opacity 0.4s";
          banner.style.opacity = "0";
          setTimeout(function() { banner.remove(); }, 400);
        }
      }, 6000);
    }

    // Reusable toast notification
    function showToast(msg) {
      var toast = document.createElement("div");
      toast.textContent = msg;
      toast.style.cssText = "position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);" +
        "background:#1a1a18;color:#fff;font-size:13px;padding:10px 18px;border-radius:20px;" +
        "z-index:10000;opacity:0;transition:opacity 0.3s;white-space:nowrap;";
      document.body.appendChild(toast);
      requestAnimationFrame(function() { toast.style.opacity = "1"; });
      setTimeout(function() {
        toast.style.opacity = "0";
        setTimeout(function() { toast.remove(); }, 400);
      }, 3500);
    }

    // If this page loaded with ?skipped=1 query param, the previous sync was
    // debounced — show a brief toast instead of the spinner
    if (window.location.search.indexOf("skipped=1") !== -1) {
      showToast("Already up to date — synced recently.");
      history.replaceState(null, "", window.location.pathname);
    }

    // Form submits (setup, schedule, log, race goal)
    document.querySelectorAll("form").forEach(function(form) {
      form.addEventListener("submit", function() {
        showOverlay("Saving", "Updating your settings.");
      });
    });

    // Cycle through reassuring messages while syncing
    var progressMessages = [
      "Connecting to Garmin...",
      "Fetching your latest activities...",
      "Analysing your training data...",
      "Calculating today's recommendation...",
      "Almost done...",
    ];
    var progressTimer = null;
    function startProgressMessages() {
      var i = 0;
      progressTimer = setInterval(function() {
        i++;
        if (i < progressMessages.length && text) {
          text.textContent = progressMessages[i];
        }
      }, 3000);
    }
  });
</script>

</body>
</html>
