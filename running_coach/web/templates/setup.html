{% extends "base.html" %}
{% block title %}Setup — Running Coach{% endblock %}
{% block content %}

<p style="font-size:13px;color:var(--c-muted);margin-bottom:1.25rem;">Fields marked <span style="color:var(--c-red);">*</span> are required for accurate recommendations.</p>

<div class="card">
  <form method="POST" action="/setup">
    <div class="form-group">
      <label>Your name</label>
      <input type="text" name="name" value="{{ profile.name if profile else '' }}" placeholder="e.g. Timeea">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Age</label>
        <input type="number" name="age" value="{{ profile.age if profile and profile.age else '' }}" placeholder="e.g. 27">
      </div>
      <div class="form-group">
        <label>Runs per week <span style="color:var(--c-red);">*</span></label>
        <input type="number" name="runs_per_week" required value="{{ profile.runs_per_week if profile else 3 }}" placeholder="3">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Max heart rate (bpm) <span style="color:var(--c-red);">*</span></label>
        <input type="number" name="max_hr" required value="{{ profile.max_hr if profile and profile.max_hr else '' }}" placeholder="e.g. 183">
        <p style="font-size:12px;color:var(--c-muted);margin-top:4px;">Look at your hardest run in Garmin — use that max HR</p>
      </div>
      <div class="form-group">
        <label>Resting heart rate (bpm) <span style="color:var(--c-red);">*</span></label>
        <input type="number" name="resting_hr" required value="{{ profile.resting_hr if profile and profile.resting_hr else '' }}" placeholder="e.g. 71">
        <p style="font-size:12px;color:var(--c-muted);margin-top:4px;">Garmin app → Health Stats → Heart Rate (morning low)</p>
      </div>
    </div>

    <div class="form-group">
      <label>Fitness level</label>
      <select name="fitness_level">
        {% for level in ['beginner','intermediate','advanced','elite'] %}
        <option value="{{ level }}" {% if profile and profile.fitness_level.value == level %}selected{% endif %}>
          {{ level|capitalize }}
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label>Weekly km goal (optional)</label>
      <input type="number" name="goal_weekly_km" step="0.5" value="{{ profile.goal_weekly_km if profile and profile.goal_weekly_km else '' }}" placeholder="e.g. 30">
    </div>

    <button type="submit" class="btn btn-primary">Save profile</button>
  </form>
</div>

{% endblock %}
