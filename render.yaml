services:
  - type: web
    name: running-coach
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web.app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: user-data
      mountPath: /app/user_data
      sizeGB: 1
