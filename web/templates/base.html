<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>{% block title %}Running Coach{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>
<nav>
  <a href="/" class="nav-brand">Running Coach</a>
  <a href="/"        class="{{ 'active' if request.path == '/' }}">Dashboard</a>
  <a href="/history" class="{{ 'active' if request.path == '/history' }}">History</a>
  <a href="/log"     class="{{ 'active' if request.path == '/log' }}">Log</a>
  <a href="/insights" class="{{ 'active' if request.path == '/insights' }}">Insights</a>
  <a href="/race"    class="{{ 'active' if request.path == '/race' }}">Race</a>
</nav>
<div class="page">
  {% block content %}{% endblock %}
</div>
</body>
</html>
