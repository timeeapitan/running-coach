<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>{% block title %}Running Coach{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>
<nav>
  <!-- Row 1: brand + user -->
  <div class="nav-top">
    <a href="/" class="nav-brand">Running Coach</a>
    <div class="nav-user">
      {% if user_avatar %}
      <img src="{{ user_avatar }}" alt="{{ user_name }}">
      {% endif %}
      <span class="nav-user-name">{{ user_name }}</span>
      <a href="/setup" class="nav-icon-btn" title="Settings">⚙</a>
      <a href="/logout" class="nav-signout">Sign out</a>
    </div>
  </div>
  <!-- Row 2: page links (scrollable, never overflows) -->
  <div class="nav-links">
    <a href="/"         class="{{ 'active' if request.path == '/' }}">Dashboard</a>
    <a href="/history"  class="{{ 'active' if request.path == '/history' }}">History</a>
    <a href="/insights" class="{{ 'active' if request.path == '/insights' }}">Insights</a>
    <a href="/log"      class="{{ 'active' if request.path == '/log' }}">Notes</a>
    <a href="/race"     class="{{ 'active' if request.path == '/race' }}">Race</a>
  </div>
</nav>
<div class="page">
  {% block content %}{% endblock %}
</div>

<div id="syncOverlay" class="sync-overlay" aria-live="polite" aria-hidden="true">
  <div class="sync-loader-card">
    <div class="sync-spinner"></div>
    <div class="sync-loader-title">Syncing your watch data</div>
    <div class="sync-loader-text">Fetching your latest activities and recovery metrics. This can take a few seconds.</div>
  </div>
</div>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var overlay = document.getElementById("syncOverlay");
    if (!overlay) return;

    var title = overlay.querySelector(".sync-loader-title");
    var text = overlay.querySelector(".sync-loader-text");

    function showOverlay(customTitle, customText) {
      if (title && customTitle) title.textContent = customTitle;
      if (text && customText) text.textContent = customText;
      overlay.classList.add("is-visible");
      overlay.setAttribute("aria-hidden", "false");
    }

    // Show feedback when navigating between server-rendered tabs.
    document.querySelectorAll('a[href]').forEach(function (link) {
      link.addEventListener("click", function () {
        var href = link.getAttribute("href") || "";
        if (!href || href.startsWith("#") || href.startsWith("mailto:") || href === "/logout") return;
        if (href === "/refresh") {
          showOverlay("Syncing your watch data", "Fetching your latest activities and recovery metrics. This can take a few seconds.");
        } else if (href.startsWith("/") || href.startsWith(window.location.origin)) {
          showOverlay("Loading", "Preparing this page from your cached running data.");
        }
      });
    });

    // Also show feedback on form submits, because setup/notes can save and redirect.
    document.querySelectorAll("form").forEach(function (form) {
      form.addEventListener("submit", function () {
        showOverlay("Saving", "Updating your running coach data.");
      });
    });
  });
</script>

</body>
</html>
